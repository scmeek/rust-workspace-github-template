name: Optional careful tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  careful:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install nightly --profile minimal --component rust-src

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: careful

      # Build with the pinned development compiler; execute tests with nightly.
      - name: Install cargo-careful
        run: cargo install --locked cargo-careful --version '=0.4.10' # Also in scripts/tools.txt

      - name: Run tests with extra runtime checks
        run: sh scripts/careful.sh
