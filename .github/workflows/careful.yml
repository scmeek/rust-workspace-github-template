name: Optional careful tests

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  careful:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
          components: rust-src

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: careful

      # Build with the pinned development compiler; execute tests with nightly.
      - name: Install cargo-careful
        run: cargo install --locked cargo-careful --version '=0.4.10' # Also in scripts/tools.txt

      - name: Run tests with extra runtime checks
        run: sh scripts/careful.sh
