name: Validate workflows and spelling

on:
  push:
    branches: ["main"]
  workflow_call:

permissions: {}

jobs:
  zizmor:
    runs-on: ubuntu-latest

    permissions:
      contents: read # only needed for private repos

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor 🌈
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Findings must fail the aggregate required check, including in private repos.
          advanced-security: false

  static-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          # Rust tool pins also live in scripts/tools.txt; native pins in README.md.
          tool: actionlint@1.7.12, shellcheck@0.11.0, typos-cli@1.50.2

      - name: Check workflows and shell scripts
        run: sh scripts/workflow-check.sh

      - name: Check spelling
        run: typos --hidden
