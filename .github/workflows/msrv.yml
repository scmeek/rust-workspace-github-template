name: Minimum supported Rust

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    env:
      # Override rust-toolchain.toml; keep this aligned with Cargo.toml's MSRV.
      RUSTUP_TOOLCHAIN: "1.86"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Run tests on the minimum supported Rust version
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Run doctests on the minimum supported Rust version
        run: cargo test --locked --workspace --all-features --doc
