name: Minimum supported Rust

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    runs-on: ubuntu-latest
    env:
      # Override rust-toolchain.toml; keep this aligned with Cargo.toml's MSRV.
      RUSTUP_TOOLCHAIN: "1.98.1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run tests on the minimum supported Rust version
        run: cargo test --locked --workspace --all-targets --all-features

      - name: Run doctests on the minimum supported Rust version
        run: cargo test --locked --workspace --all-features --doc
