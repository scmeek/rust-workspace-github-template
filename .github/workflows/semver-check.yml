name: Check semantic versioning

on:
  workflow_dispatch:
    inputs:
      baseline-rev:
        description: Git revision to compare library APIs against
        default: origin/main
        type: string
  workflow_call:
    inputs:
      baseline-rev:
        default: origin/main
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  semver-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1" # Also defined in rust-toolchain.toml

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-semver-checks@0.50.0 # Also defined in scripts/tools.txt

      - name: Check semver compatibility - template_lib
        env:
          BASELINE_REV: ${{ github.event.pull_request.base.sha || inputs.baseline-rev }}
        run: ./scripts/version-check.sh "$BASELINE_REV"
