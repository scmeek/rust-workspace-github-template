name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    uses: ./.github/workflows/format-check.yml

  lint:
    uses: ./.github/workflows/lint-check.yml

  test:
    uses: ./.github/workflows/test.yml

  msrv:
    uses: ./.github/workflows/msrv.yml

  dependency-policy:
    uses: ./.github/workflows/dependency-policy.yml

  semver:
    uses: ./.github/workflows/semver-check.yml

  unused-dependencies:
    uses: ./.github/workflows/unused-dependencies-check.yml

  workflow-security:
    uses: ./.github/workflows/zizmor.yml

  pr-title:
    uses: ./.github/workflows/pr-title-validate.yml

  required:
    name: Required checks
    if: always()
    needs:
      - format
      - lint
      - test
      - msrv
      - dependency-policy
      - semver
      - unused-dependencies
      - workflow-security
      - pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Check required workflow results
        env:
          RESULTS: >-
            ${{ needs.format.result }}
            ${{ needs.lint.result }}
            ${{ needs.test.result }}
            ${{ needs.msrv.result }}
            ${{ needs.dependency-policy.result }}
            ${{ needs.semver.result }}
            ${{ needs.unused-dependencies.result }}
            ${{ needs.workflow-security.result }}
            ${{ needs.pr-title.result }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "A required workflow did not succeed: $result"
              exit 1
            fi
          done
