[workspace]
resolver = "3"
members = ["crates/template_bin", "crates/template_lib"]

[workspace.package]
description = "A minimal Rust workspace with a library and command-line application"
edition = "2024"
rust-version = "1.98.1"       # Also defined in GitHub Actions workflow runners

license-file = "LICENSE"
repository = "https://github.com/scmeek/rust-workspace-github-template"

publish = false

[workspace.dependencies]
template_lib = { path = "crates/template_lib" }

criterion = { version = "0.8", features = ["html_reports"] } # Benchmarks

# -- Lints --

[workspace.lints.rust]
# Safe by default; narrowly scoped, reasoned exceptions remain possible.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
let_underscore_lock = "deny"
unfulfilled_lint_expectations = "deny"
arithmetic_overflow = "deny"
unnecessary_transmutes = "deny"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unreachable_pub = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]

# Broad maintained groups. `all` includes correctness, suspicious, style,
# complexity, and performance; `pedantic` adds casts, API docs, and idioms.
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# Publication metadata belongs to each generated project. Transitive dependency
# duplication is not always under our control.
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

# Selected restriction lints: do not enable the whole contradictory group.
# Tests can unwrap/expect/panic and print, as configured in clippy.toml.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
exit = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Make discarded work, hidden errors, and path replacement explicit.
let_underscore_must_use = "deny"
let_underscore_future = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"
mem_forget = "deny"
path_buf_push_overwrite = "deny"
string_slice = "deny"
unchecked_time_subtraction = "deny"
try_err = "deny"

# Document exceptions and unsafe invariants if unsafe is explicitly permitted.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Readability and avoidable allocation without prescribing a source-code layout.
clone_on_ref_ptr = "deny"
redundant_type_annotations = "deny"
rest_pat_in_fully_bound_structs = "deny"
unneeded_field_pattern = "deny"
missing_assert_message = "warn"

# Additional opt-in nursery/restriction checks. Avoid enabling every experimental
# style rule or automatically enabling new nursery additions on toolchain updates.
as_ptr_cast_mut = "deny"
collection_is_never_read = "deny"
debug_assert_with_mut_call = "deny"
empty_drop = "deny"
equatable_if_let = "deny"
iter_on_empty_collections = "deny"
iter_on_single_items = "deny"
large_futures = "deny"
needless_collect = "deny"
non_send_fields_in_send_ty = "deny"
readonly_write_lock = "deny"
redundant_clone = "deny"
redundant_pub_crate = "deny"
return_and_then = "deny"
significant_drop_in_scrutinee = "deny"
suspicious_operation_groupings = "deny"
unused_peekable = "deny"
unused_rounding = "deny"
use_self = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "deny"
